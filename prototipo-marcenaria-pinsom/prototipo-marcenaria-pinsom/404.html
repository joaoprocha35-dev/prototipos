<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Marcenaria Pinson</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --text: #fffdf9;
      --muted: #9c8d82;
      --accent: #c07d3e;
    }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .wrap { max-width: 480px; }
    .logo { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; }
    .code { font-size: clamp(5rem, 20vw, 8rem); font-weight: 800; line-height: 1; color: var(--accent); opacity: 0.18; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 600; margin-top: -1rem; margin-bottom: 1rem; }
    p { color: var(--muted); line-height: 1.6; margin-bottom: 2.5rem; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 100px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="logo">Marcenaria Pinson</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi removido.<br>Volte para a página inicial e conheça nossos projetos.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
